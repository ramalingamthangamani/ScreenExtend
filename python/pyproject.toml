[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "screenextend"
version = "1.0.0"
description = "Use a phone or tablet as an extra monitor for a Windows PC: virtual display, touch, keyboard, window management, all from the phone's browser."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "ScreenExtend contributors" }]
keywords = ["second monitor", "virtual display", "extend display", "phone", "tablet", "screen", "windows", "touch"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3",
  "Programming Language :: C#",
  "Topic :: Desktop Environment",
  "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/your-name/screenextend"
Issues = "https://github.com/your-name/screenextend/issues"

[project.scripts]
screenextend = "screenextend.cli:main"

[tool.setuptools]
packages = ["screenextend"]
include-package-data = true

[tool.setuptools.package-data]
screenextend = ["bin/*.exe", "bin/*.txt"]

[tool.distutils.bdist_wheel]
python-tag = "py3"
# The wheel carries a win-x64 executable, so tag it as a Windows wheel rather than a pure-Python one.
plat-name = "win_amd64"
