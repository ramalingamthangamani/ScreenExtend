<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ScreenExtend">
<title>ScreenExtend</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="client.css">
</head>
<body>
<main id="stage" aria-label="Extended display">
  <canvas id="screen"></canvas>
</main>

<div id="hud" class="hud">
  <button id="hudToggle" class="hud-dot" aria-label="Toggle toolbar"><span class="q-dot" data-q="none"></span></button>
  <div class="hud-body">
    <div class="hud-stats" id="hudStats" title="Connection quality">
      <span class="bars" data-q="none"><i></i><i></i><i></i><i></i></span>
      <span id="statFps">-- fps</span>
      <span class="sep"></span>
      <span id="statLat">-- ms</span>
    </div>
    <div class="hud-actions">
      <button id="btnMode" class="icon-btn" aria-label="Input mode" title="Input mode"></button>
      <button id="btnApps" class="icon-btn" aria-label="Apps on this display" title="Move an app here"></button>
      <button id="btnKbd" class="icon-btn" aria-label="Keyboard" title="Keyboard"></button>
      <button id="btnPause" class="icon-btn" aria-label="Pause stream" title="Pause / resume"></button>
      <button id="btnFull" class="icon-btn" aria-label="Fullscreen" title="Fullscreen"></button>
      <button id="btnSettings" class="icon-btn" aria-label="Settings" title="Settings"></button>
    </div>
  </div>
</div>

<div id="banner" class="banner hidden" role="status">
  <span id="bannerText"></span>
  <button id="bannerAction" class="banner-btn hidden"></button>
  <button id="bannerClose" class="banner-x" aria-label="Dismiss">&#10005;</button>
</div>

<button id="zoomChip" class="chip hidden" aria-label="Reset zoom"></button>
<div id="toast" class="toast hidden" role="status"></div>

<textarea id="kbd" class="kbd-sink" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Type on the PC"></textarea>
<div id="keybar" class="keybar hidden" role="toolbar" aria-label="Special keys">
  <button data-mod="ctrl">Ctrl</button><button data-mod="alt">Alt</button><button data-mod="shift">Shift</button><button data-mod="win">Win</button>
  <button data-key="Escape">Esc</button><button data-key="Tab">Tab</button>
  <button data-key="ArrowLeft" aria-label="Left">&#8592;</button><button data-key="ArrowUp" aria-label="Up">&#8593;</button><button data-key="ArrowDown" aria-label="Down">&#8595;</button><button data-key="ArrowRight" aria-label="Right">&#8594;</button>
  <button data-key="Backspace" aria-label="Backspace">&#9003;</button><button data-key="Delete">Del</button><button data-key="Home">Home</button><button data-key="End">End</button>
  <button data-key="PageUp">PgUp</button><button data-key="PageDown">PgDn</button><button data-key="F5">F5</button>
  <button data-key="Enter">Enter</button>
  <button data-act="close" class="keybar-close" aria-label="Hide keyboard">&#10005;</button>
</div>

<section id="apps" class="sheet hidden" aria-label="Apps">
  <div class="sheet-card">
    <div class="sheet-head">
      <h2>Apps on this display</h2>
      <button id="appsRefresh" class="icon-btn" aria-label="Refresh" title="Refresh"></button>
    </div>
    <p class="sheet-info">Tap a window to bring it onto this screen. Windows already here are marked.</p>
    <button id="appsMoveFg" class="btn primary wide">Move the active PC window here</button>
    <ul id="appsList" class="apps-list"><li class="empty">Loading…</li></ul>
    <div class="sheet-actions"><span></span><button id="appsClose" class="btn">Done</button></div>
  </div>
</section>

<section id="sheet" class="sheet hidden" aria-label="Settings">
  <div class="sheet-card">
    <h2>Settings</h2>
    <label class="field"><span>Use this device as</span>
      <select id="setMode"></select>
    </label>
    <label class="field extend-only"><span>Resolution</span>
      <select id="setRes">
        <option value="1920">Auto (up to 1080p)</option>
        <option value="1280">Lighter (up to 720p)</option>
        <option value="1600">Up to 900p</option>
        <option value="2560">Up to 1440p</option>
        <option value="3840">Up to 4K</option>
        <option value="0">Largest available</option>
      </select>
    </label>
    <label class="field extend-only"><span>Windows scaling</span>
      <select id="setScale">
        <option value="0">Auto</option>
        <option value="100">100%</option>
        <option value="125">125%</option>
        <option value="150">150%</option>
        <option value="175">175%</option>
        <option value="200">200%</option>
        <option value="225">225%</option>
        <option value="250">250%</option>
      </select>
    </label>
    <label class="field"><span>Stream quality</span>
      <select id="setQuality">
        <option value="native">Native (sharpest)</option>
        <option value="high">High</option>
        <option value="balanced">Balanced</option>
        <option value="low">Low (fastest)</option>
      </select>
    </label>
    <label class="field"><span>Trackpad speed</span><input id="setSens" type="range" min="0.4" max="2.5" step="0.1"></label>
    <label class="field"><span>Device name</span><input id="setName" type="text" maxlength="40" autocomplete="off"></label>
    <p class="sheet-info" id="setInfo"></p>
    <div class="sheet-actions">
      <button id="setForget" class="btn">Forget this PC</button>
      <button id="setClose" class="btn primary">Done</button>
    </div>
  </div>
</section>

<section id="overlay" class="overlay" aria-live="polite">
  <div class="overlay-card">
    <div class="spinner" id="ovSpinner"></div>
    <h2 id="ovTitle">Connecting…</h2>
    <p id="ovText"></p>
    <form id="pairForm" class="pair-form hidden" autocomplete="off">
      <input id="pairCode" type="text" inputmode="numeric" pattern="[0-9 ]*" maxlength="7" placeholder="000 000" aria-label="Pairing code" autocomplete="one-time-code">
      <button id="pairBtn" type="submit" class="btn primary">Pair</button>
      <p id="pairMsg" class="pair-msg"></p>
    </form>
    <button id="ovAction" class="btn primary hidden"></button>
  </div>
</section>

<script src="client.js"></script>
</body>
</html>
